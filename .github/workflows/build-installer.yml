name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Run tests
        run: python -m pytest

  build-installer:
    name: Build installer
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip ".[installer]"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress --limit-output

      - name: Build and smoke-test installer
        shell: pwsh
        run: |
          $arguments = @()
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $arguments = @("-Version", $env:GITHUB_REF_NAME)
          }
          & .\scripts\build-installer.ps1 @arguments

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: twrailwaysim-installer-${{ github.sha }}
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14
