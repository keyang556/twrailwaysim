[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railway-sim"
version = "0.1.0"
description = "臺灣鐵路人員模擬器（無障礙優先）"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["wxPython>=4.2"]
# 車上廣播的播放後端。臺鐵廣播是 Ogg Vorbis，Windows 內建的播放元件不解這個
# 格式；pygame 內建 SDL_mixer 可以直接播。沒有安裝時會改用 PATH 上的 ffplay，
# 兩者都沒有就只播文字，遊戲功能不受影響（規格 §20.1）。
audio = ["pygame>=2.5"]
dev = ["pytest>=8.0"]
installer = [
    "pyinstaller==6.21.0",
    "wxPython==4.3.1",
    "pygame>=2.5",
]

[project.scripts]
railway-sim = "railway_sim.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
railway_sim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
